merge_protections:
  # Migrated from post_check rule 'Require approval from DCGM exporter contributors'. Dropped options with no equivalent: title
  - name: Require approval from DCGM exporter contributors
    if:
      - "#approved-reviews-by>=1"
    success_conditions:
      - or:
          - "#approved-reviews-by>=2"
          - and:
              - "#approved-reviews-by>=1"
              - "author~=^(d80tb7|dave[-]gantenbein|masipauskas|nikola-jokic|m4rs[-]mt)"
